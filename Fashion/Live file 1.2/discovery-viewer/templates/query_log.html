{% extends "base.html" %}
{% block content %}
<h2>Query Log Summary</h2>

{% if data %}
<table>
    <thead>
        <tr>
            <th>Source</th>
            <th>Queries Run</th>
            <th>Queries with Zero Results</th>
        </tr>
    </thead>
    <tbody>
        {% for row in data %}
        <tr>
            <td>{{ row.source }}</td>
            <td>{{ row.queries_run }}</td>
            <td>{{ row.zero_results }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
    <p><em>Could not load query_log.csv data.</em></p>
{% endif %}
{% endblock %}
