<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <defs>
    <radialGradient id="neutralStudioBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8f8f9"/>
      <stop offset="100%" stop-color="#eeeeef"/>
    </radialGradient>
    <filter id="softSubtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="400" height="533" fill="url(#neutralStudioBg)"/>

  <!-- Minimal Elegant Product Container -->
  <g filter="url(#softSubtleShadow)" transform="translate(100, 160)">
    <rect width="200" height="200" rx="12" fill="#ffffff" stroke="#eaeaec" stroke-width="1.5"/>
    
    <!-- Minimalist Coat Hanger / Shopping Bag Silhouette in Nykaa Grey -->
    <g fill="none" stroke="#b5b6bb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(50, 45)">
      <!-- Hanger Hook -->
      <path d="M50,15 C50,5 62,5 62,15 C62,25 50,30 50,38"/>
      <!-- Hanger Shoulder Line -->
      <path d="M10,65 L50,40 L90,65"/>
      <path d="M15,65 L85,65"/>
    </g>

    <!-- Neutral Catalog Text -->
    <text x="100" y="145" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7e818c" text-anchor="middle" letter-spacing="1">NYKAA FASHION</text>
    <text x="100" y="165" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="500" fill="#b5b6bb" text-anchor="middle" letter-spacing="0.5">IMAGE AWAITING SELLER</text>
  </g>

  <!-- Minimal Brand Corner -->
  <text x="24" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#d4d5d9" letter-spacing="1.2">NYKAA DECIDE</text>
</svg>
